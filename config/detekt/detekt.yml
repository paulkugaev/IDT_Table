# Detekt configuration (builds upon the default config).
# See https://detekt.dev/docs/introduction/configurations

build:
  maxIssues: 0

# Compose/Android-friendly relaxations of the default ruleset.
naming:
  PackageNaming:
    active: true
    packagePattern: '[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*' # allow underscores (e.g. com.badmanners.common_ui)
  FunctionNaming:
    active: false # Compose composables use PascalCase (IDTTableTheme)

style:
  MagicNumber:
    active: false # Compose color literals (0xFF...) are pervasive
  NewLineAtEndOfFile:
    active: false # formatting is handled by the formatter, not detekt